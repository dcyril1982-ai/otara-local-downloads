name: Publish verified 2.3.5 release
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-verified-235.yml]
permissions:
  contents: write
concurrency:
  group: publish-verified-release-235
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'dcyril1982-ai/otara-local-downloads' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify exact release inventory then publish fixed draft
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import hashlib, json, os, urllib.request
          REPO = "dcyril1982-ai/otara-local-downloads"
          RELEASE_ID = 446155312
          EXPECTED = {'Otara-Local-2.3.5-macOS-universal.dmg': {'bytes': 88726443, 'digest': 'sha256:964af5d0786260536c7babfd65150f42e6740e504cc4a11cd9c4c369a0f2cb88'}, 'Otara-Local-2.3.5-macOS-universal.zip': {'bytes': 78199972, 'digest': 'sha256:a8d7ab6a201bee0a42fe706e99c7dce3e81b25e0e2a0f57ad1199c4de05f7fa9'}, 'Otara-Local-2.3.5-Windows-x64-Setup.exe': {'bytes': 276543619, 'digest': 'sha256:3eecd3877b51b611e0266b4d42752f755319bfb938d67f079bb4ba6406b19f78'}, 'otara-update.json': {'bytes': 1077, 'digest': 'sha256:db76bc7b928cc3e529b61aee4e83ad7167a786e228cfab07f21734217020ef71'}, 'Otara-Worker-2.3.5-Android.apk': {'bytes': 45831438, 'digest': 'sha256:c810af46c691ca3e4ab356e0c82925654acb314a9b3e218003f410c828b55300'}, 'SHA256SUMS.txt': {'bytes': 495, 'digest': 'sha256:c2988f675d19e91364c19d7160bdde6a31061c8235b22d54aef00c2a0be34438'}}
          BODY_HASH = '759f703781b8e422ce582cff6575a00b31067d6e152af1e11410a453c4e7eccf'
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  raise RuntimeError("Unexpected GitHub API redirect")
          opener = urllib.request.build_opener(NoRedirect())
          url = f"https://api.github.com/repos/{REPO}/releases/{RELEASE_ID}"
          def request(method="GET", payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(url, data=data, method=method, headers={
                  "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                  "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "Otara-verified-release-2.3.5", "Content-Type": "application/json"})
              with opener.open(req, timeout=40) as response:
                  return json.load(response)
          def verify(release):
              assert release["id"] == RELEASE_ID and release["tag_name"] == "v2.3.5"
              assert release["name"] == "Отара Local 2.3.5" and not release["prerelease"]
              assert len(release["assets"]) == len(EXPECTED)
              assert {a["name"] for a in release["assets"]} == set(EXPECTED)
              for asset in release["assets"]:
                  expected = EXPECTED[asset["name"]]
                  assert asset["state"] == "uploaded"
                  assert asset["size"] == expected["bytes"] and asset["digest"] == expected["digest"]
              body = release["body"].replace("\r\n", "\n").rstrip("\n")
              assert hashlib.sha256(body.encode()).hexdigest() == BODY_HASH
          release = request()
          verify(release)
          if release["draft"]:
              release = request("PATCH", {"draft": False, "make_latest": "true"})
          verify(release)
          assert release["draft"] is False
          assert release["html_url"] == f"https://github.com/{REPO}/releases/tag/v2.3.5"
          print("PASS: six exact verified assets published as version 2.3.5")
          print(release["html_url"])
          PYCODE
